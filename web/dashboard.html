<!DOCTYPE html>
<html>
<head>
    <title>Patient Dashboard - Sunrise Dental</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        .header { background: #004085; color: white; padding: 15px 20px; text-align: right; }
        .header a { color: #ffc107; text-decoration: none; font-weight: bold; margin-left: 20px; }
        .container { text-align: center; margin-top: 60px; }
        .box { background: white; padding: 40px; display: inline-block; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 60%; }
        h1 { color: #004085; margin-bottom: 10px; }
        p { color: #555; font-size: 16px; margin-bottom: 30px; }
        .btn-group { display: flex; justify-content: center; gap: 20px; }
        .btn { padding: 15px 25px; background: #007bff; color: white; text-decoration: none; font-size: 16px; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="header">
        <span>Welcome to Patient Portal</span>
        <a href="index.html">Logout</a>
    </div>

    <div class="container">
        <div class="box">
            <h1>Sunrise Dental Clinic</h1>
            <p>Manage your oral health easily. Book an appointment with our expert dentists today.</p>
            
            <div class="btn-group">
                <!-- Meka appointment.jsp walata wenas karala thiyenne -->
                <a href="appointment.jsp" class="btn">Book New Appointment</a>
                <a href="#" class="btn btn-secondary">View My Profile</a>
            </div>
        </div>
    </div>
</body>
</html>
